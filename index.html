        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            justify-items: center;
            max-width: 500px;
            margin: 0 auto;
            padding: 5px;

        /* கார்டின் சைஸ் மற்றும் டிசைன் */
        .product-card { 
            border: 1px solid #ccc; 
            padding: 10px; 
            width: 100%; 
            background-color: white;
            border-radius: 8px; 
            box-shadow: 2px 2px 8px #ddd;
            box-sizing: border-box;
            text-align: center;
        }
        
        .product-card img { 
            width: 100%; 
            height: auto;
            border-radius: 4px; 
        }
        
        .product-card h2 {
            font-size: 15px;
            margin: 10px 0 5px 0;
            color: #000;
        }
        
        .product-card p {
            font-size: 13px;
            margin: 5px 0;
            color: #555;
        }
        
        .product-card button { 
            background-color: #28a745; 
            color: white; 
            border: none; 
            padding: 8px 12px; 
            border-radius: 5px; 
            cursor: pointer;
            font-size: 13px;
            width: 100%; 
            font-weight: bold;
        }
        
        .product-card button:hover { 
            background-color: #218838; 
        }
    </style>
